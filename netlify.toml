# The association file is what makes pushuptabata.com/start open the app.
# It must be served as JSON, over HTTPS, with no redirect — and it has no file
# extension, so the content type has to be declared here or Netlify guesses wrong
# and the link silently falls back to the website.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The association file has to be served, not redirected, on every host the app
# claims — Apple fetches it directly and will not follow a 301. This rewrite
# (status 200) serves it on www too, and must stay above the redirect below,
# because Netlify applies the first rule that matches.
[[redirects]]
  from = "https://www.pushuptabata.com/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

# Canonical host: everything else on www moves to the bare domain, so search
# engines and shared links agree on one address.
[[redirects]]
  from = "https://www.pushuptabata.com/*"
  to = "https://pushuptabata.com/:splat"
  status = 301
  force = true
