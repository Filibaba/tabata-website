# The association file is what makes pushuptabata.com/start open the app.
# It must be served as JSON, over HTTPS, with no redirect — and it has no file
# extension, so the content type has to be declared here or Netlify guesses wrong
# and the link silently falls back to the website.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonical host: one address for the site, so search engines and the association
# file agree on where it lives.
[[redirects]]
  from = "https://www.pushuptabata.com/*"
  to = "https://pushuptabata.com/:splat"
  status = 301
  force = true
